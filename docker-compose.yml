services:
  postgres:
    image: postgres:16-alpine
    container_name: diy-bracelets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong non-default value}
      POSTGRES_DB: ${DB_DATABASE:-diy_bracelets}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-diy_bracelets}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diy-bracelets-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong non-default value}
      DB_DATABASE: ${DB_DATABASE:-diy_bracelets}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-}
      DB_SSL_CA: ${DB_SSL_CA:-}
      UPLOAD_DIR: /app/uploads
      UPLOAD_STORAGE_MODE: persistent
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the comma-separated production frontend origins}
      CORS_ALLOW_CREDENTIALS: "true"
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Generate ADMIN_PASSWORD_HASH with npm run auth:hash-password}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_COOKIE_SECURE: "true"
      ADMIN_COOKIE_SAME_SITE: ${ADMIN_COOKIE_SAME_SITE:-strict}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?Set WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?Set WECHAT_APP_SECRET}
      USER_SESSION_TTL_SECONDS: ${USER_SESSION_TTL_SECONDS:-2592000}
      DESIGN_PROCESS_VIDEO_ENABLED: ${DESIGN_PROCESS_VIDEO_ENABLED:-false}
      CHROME_PATH: /usr/bin/chromium-browser
      FFMPEG_PATH: /usr/bin/ffmpeg
      VIDEO_WEB_RENDER_URL: ${VIDEO_WEB_RENDER_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

volumes:
  postgres_data:
  uploads_data:
