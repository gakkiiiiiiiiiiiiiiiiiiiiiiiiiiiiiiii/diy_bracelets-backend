name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate operations assets
        run: |
          bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh
          ci_admin_hash=$(printf '%s' 'ci-admin-password' | npm run --silent auth:hash-password)
          DB_PASSWORD=ci-database-password \
            CORS_ORIGINS=https://admin.example.com \
            ADMIN_USERNAME=ci-admin \
            ADMIN_PASSWORD_HASH="$ci_admin_hash" \
            docker compose config --quiet

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
